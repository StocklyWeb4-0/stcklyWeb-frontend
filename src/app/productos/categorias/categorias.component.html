<div class="category-management-container" style="padding: 16px; max-width: 900px; margin: auto; background-color: #f9f9f9; border-radius: 8px;">
  <h2>Gestión de Categorías</h2>

  <div style="display: none;">
    <form (ngSubmit)="guardarCategoria()" #categoriaForm="ngForm" style="display: flex; flex-direction: column; gap: 16px; max-width: 400px; margin-bottom: 24px;">
      <mat-form-field appearance="fill">
        <mat-label>Nombre de la Categoría</mat-label>
        <input matInput name="name" [(ngModel)]="categoriaSeleccionada.name" required />
      </mat-form-field>

      <div style="display: flex; gap: 8px;">
        <button mat-raised-button color="primary" type="submit" [disabled]="!categoriaForm.form.valid">
          {{ categoriaSeleccionada.id ? 'Actualizar' : 'Crear' }}
        </button>
        <button mat-raised-button color="warn" type="button" (click)="cancelarEdicion()">Cancelar</button>
      </div>
    </form>
  </div>

  <table mat-table [dataSource]="categories" class="mat-elevation-z8 full-width-table" style="background-color: white; border-radius: 8px;">

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let category">{{ category.id }}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let category">{{ category.name }}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let category">
        <button mat-icon-button color="primary" (click)="seleccionarCategoria(category)" aria-label="Editar categoría">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminarCategoria(category.id)" aria-label="Eliminar categoría">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['id', 'name', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id', 'name', 'actions'];"></tr>
  </table>
</div>
