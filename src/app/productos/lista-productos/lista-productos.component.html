<div class="product-list-container" style="padding: 16px; max-width: 900px; margin: auto; background-color: #f9f9f9; border-radius: 8px;">
  <div class="toolbar" style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px; margin-bottom: 16px;">
    <!-- Filtro de búsqueda -->
    <mat-form-field appearance="fill" style="width: 100%;">
      <mat-label>Buscar productos</mat-label>
      <input matInput (keyup)="aplicarFiltro($event)" placeholder="Buscar productos" />
      <button mat-icon-button matSuffix aria-label="Limpiar" *ngIf="filtro" (click)="filtro=''; aplicarFiltroInterno()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>

    <!-- Filtro de categoría y botón Agregar Categoría juntos -->
    <div style="display: flex; align-items: center; gap: 8px; flex-direction: column; align-items: flex-start;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <mat-form-field appearance="fill" style="width: 200px; margin: 0;">
          <mat-label>Filtrar por categoría</mat-label>
          <mat-select [(value)]="selectedCategory" (selectionChange)="onCategoryChange()">
            <mat-option [value]="''">Todas</mat-option>
            <mat-option *ngFor="let category of categories" [value]="category.id">
              {{ category.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <button mat-raised-button color="primary" routerLink="/productos/categorias">Agregar Categoría</button>
      </div>
      <span style="font-size: 0.875rem; color: #666;">
        Si no existe la categoría deseada, haz clic en "Agregar Categoría"
      </span>
    </div>
  </div>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 full-width-table" style="width: 100%; background-color: white; border-radius: 8px;">

    <!-- Código Column -->
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
      <td mat-cell *matCellDef="let producto">{{ producto.code }}</td>
    </ng-container>

    <!-- Producto Column -->
    <ng-container matColumnDef="producto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Producto</th>
      <td mat-cell *matCellDef="let producto">{{ producto.name }}</td>
    </ng-container>

    <!-- Stock Column -->
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
      <td mat-cell *matCellDef="let producto">{{ producto.stock }}</td>
    </ng-container>

    <!-- Precio Column -->
    <ng-container matColumnDef="precio">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
      <td mat-cell *matCellDef="let producto">{{ producto.price | currency:'USD':'symbol':'1.2-2' }}</td>
    </ng-container>

    <!-- Acciones Column -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let producto">
        <button mat-icon-button color="primary" (click)="editarProducto(producto.id)" aria-label="Editar producto">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminarProducto(producto.id)" aria-label="Eliminar producto">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="totalProductos" [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons (page)="cargarProductos($event.pageIndex, $event.pageSize)">
  </mat-paginator>

  <div style="margin-top: 16px; text-align: right;">
    <button mat-raised-button color="primary" (click)="agregarProducto()">Agregar producto</button>
  </div>
</div>
