<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Iniciar Sesión en StocklyWeb</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Campo correo -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo Electrónico</mat-label>
          <input
            matInput
            formControlName="correo"
            type="email"
            placeholder="Ingresa tu correo electrónico"
          />
          <mat-error *ngIf="loginForm.get('correo')?.hasError('required')">
            El correo es obligatorio.
          </mat-error>
          <mat-error *ngIf="loginForm.get('correo')?.hasError('email')">
            Por favor, introduce un correo válido.
          </mat-error>
        </mat-form-field>

        <!-- Campo contraseña -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            formControlName="contrasena"
            [type]="hidePassword ? 'password' : 'text'"
            placeholder="Ingresa tu contraseña"
          />
          <mat-error *ngIf="loginForm.get('contrasena')?.hasError('required')">
            La contraseña es obligatoria.
          </mat-error>
        </mat-form-field>

        <!-- Botón Ingresar -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid"
          class="full-width login-button"
        >
          Ingresar
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions align="start" style="margin-top: 15px;">
      <button mat-button color="accent" routerLink="/registro">
        ¿No tienes cuenta? Regístrate
      </button>
    </mat-card-actions>
  </mat-card>
</div>
