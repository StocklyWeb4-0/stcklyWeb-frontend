<div class="dashboard-container">
  <h1 style="margin: 40px 0 24px 0; align-self: flex-start;">Dashboard de StocklyWeb</h1>
  <div class="row" style="flex-wrap: wrap; margin-bottom: 24px; width: 100%;">
    <div class="col-xl-3 col-lg-4 col-md-6 mb-4 d-flex" *ngFor="let card of cards">
      <div class="card bg-white shadow h-100 py-2 flex-fill" style="min-width: 220px;">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">{{ card.title }}</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">{{ card.value }}</div>
              <div class="mt-2">{{ card.description }}</div>
            </div>
          </div>
          <div class="mt-3" *ngIf="card.action">
            <a class="btn btn-primary btn-sm" [routerLink]="card.action.link">{{ card.action.label }}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row" style="flex: 1 1 auto; width: 100%;">
    <div class="col-lg-8 mb-4 d-flex" style="min-width: 300px;">
      <div class="card shadow mb-4 h-100 flex-fill">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">Ventas por Mes</h6>
        </div>
        <div class="card-body">
          <app-dashboard-chart [title]="'Ventas por Mes'" [chartData]="chartData"></app-dashboard-chart>
        </div>
      </div>
    </div>
    <div class="col-lg-4 mb-4 d-flex" style="min-width: 250px;">
      <div class="card shadow mb-4 h-100 flex-fill">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">{{ tableTitle }}</h6>
        </div>
        <div class="card-body">
          <app-dashboard-table [title]="tableTitle" [columns]="tableColumns" [data]="tableData"></app-dashboard-table>
        </div>
      </div>
    </div>
  </div>
</div>
