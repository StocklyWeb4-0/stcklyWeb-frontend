<div class="container">
  <h2>{{ editMode ? 'Editar Estado de Venta' : 'Crear Estado de Venta' }}</h2>
  <form [formGroup]="saleStatusForm" (ngSubmit)="guardar()">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" required>
      <mat-error *ngIf="saleStatusForm.get('name')?.hasError('required')">
        El nombre es obligatorio
      </mat-error>
      <mat-error *ngIf="saleStatusForm.get('name')?.hasError('minlength')">
        El nombre debe tener al menos 3 caracteres
      </mat-error>
    </mat-form-field>
    <div style="margin-top: 16px;">
      <button mat-raised-button color="primary" type="submit" [disabled]="saleStatusForm.invalid">
        {{ editMode ? 'Actualizar' : 'Crear' }}
      </button>
      <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
