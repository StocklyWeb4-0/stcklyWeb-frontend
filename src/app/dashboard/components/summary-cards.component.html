<div class="dashboard-cards">
  <mat-card class="dashboard-card" *ngFor="let card of cards">
    <mat-card-header>
      <mat-card-title>{{ card.title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ card.description }}</p>
      <h2>{{ card.value }}</h2>
    </mat-card-content>
    <mat-card-actions *ngIf="card.action">
      <button mat-raised-button color="primary" [routerLink]="card.action.link">{{ card.action.label }}</button>
    </mat-card-actions>
  </mat-card>
</div>
