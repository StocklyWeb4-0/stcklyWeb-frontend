<div class="dashboard-list-container">
  <h2>Estados de Venta</h2>
  <button mat-raised-button color="primary" (click)="crearEstadoVenta()">Crear Estado de Venta</button>
  <table mat-table [dataSource]="saleStatuses" class="mat-elevation-z8" *ngIf="saleStatuses.length">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let status">{{ status.id }}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let status">{{ status.name }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let status">
        <button mat-icon-button color="accent" (click)="editarEstadoVenta(status.id)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="eliminarEstadoVenta(status.id)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <div *ngIf="!saleStatuses.length && !loading" class="empty-message">
    No hay estados de venta registrados.
  </div>
  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
</div>
