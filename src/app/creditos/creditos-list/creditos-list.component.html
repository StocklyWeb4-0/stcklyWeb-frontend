<div class="container mt-4">
  <h2>Lista de Créditos</h2>
  <button mat-raised-button color="primary" routerLink="/creditos/estado-pagos" class="mb-3">Estados de Pago</button>
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8" *ngIf="dataSource && dataSource.data.length > 0">

    <!-- Venta ID Column -->
    <ng-container matColumnDef="saleId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Venta</th>
      <td mat-cell *matCellDef="let credito">{{ credito.sale?.id || 'N/A' }}</td>
    </ng-container>

    <!-- Cliente Column -->
    <ng-container matColumnDef="cliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Cliente</th>
      <td mat-cell *matCellDef="let credito">{{ credito.sale?.customer?.name || 'N/A' }}</td>
    </ng-container>

    <!-- Total Column -->
    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Total</th>
      <td mat-cell *matCellDef="let credito">{{ credito.total | currency }}</td>
    </ng-container>

    <!-- Fecha de Pago Column -->
    <ng-container matColumnDef="paymentDeadline">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha de Pago</th>
      <td mat-cell *matCellDef="let credito">{{ credito.paymentDeadline | date:'shortDate' }}</td>
    </ng-container>

    <!-- Estado Column -->
    <ng-container matColumnDef="statusCredit">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
      <td mat-cell *matCellDef="let credito">{{ credito.statusCredit?.name }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <p *ngIf="dataSource && dataSource.data.length === 0">No hay créditos disponibles.</p>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons *ngIf="dataSource && dataSource.data.length > 0"></mat-paginator>
</div>
