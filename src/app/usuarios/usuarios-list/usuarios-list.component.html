    <div class="mat-elevation-z8">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <mat-form-field appearance="fill" class="full-width" style="max-width: 350px;">
                <mat-label>Buscar usuario</mat-label>
                <input matInput (keyup)="aplicarFiltro($event)" placeholder="Buscar por nombre o correo" />
            </mat-form-field>
            <button mat-raised-button color="primary" (click)="crearUsuario()" style="margin-left: 16px; min-width: 160px;">
                <mat-icon>person_add</mat-icon> Crear Usuario
            </button>
        </div>
    
        <table mat-table [dataSource]="dataSource" matSort class="full-width-table">
    
        <!-- Nombre -->
        <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let usuario">{{ usuario.name }}</td>
        </ng-container>
    
        <!-- Correo -->
        <ng-container matColumnDef="correo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Correo</th>
            <td mat-cell *matCellDef="let usuario">{{ usuario.email }}</td>
        </ng-container>
    
        <!-- Rol -->
        <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
            <td mat-cell *matCellDef="let usuario">
              {{ usuario.roles && usuario.roles.length ? usuario.roles[0].name : '' }}
            </td>
        </ng-container>
    
        <!-- Acciones -->
        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let usuario">
            <button mat-icon-button color="primary" (click)="editarUsuario(usuario)">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminarUsuario(usuario)">
                <mat-icon>delete</mat-icon>
            </button>
            </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
